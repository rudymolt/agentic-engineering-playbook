name: Playbook maintenance cadence

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-drift-due:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check monthly upstream comparison state
        run: python3 v0.5/scripts/check-upstream-drift.py
