name: Playbook CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      checkpoint_baseline:
        description: "Measure the pinned checkpoint baseline after required jobs"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Classify public edition test scope
        id: edition-scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            python3 v0.5/scripts/edition_ci_scope.py \
              --base "$PR_BASE_SHA" --head "$GITHUB_SHA" \
              >> "$GITHUB_OUTPUT"
          else
            {
              echo "run_full=true"
              echo "reason=main push or manual run"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Verify public edition and content boundary
        if: steps.edition-scope.outputs.run_full == 'true'
        run: python3 v0.5/scripts/verify-playbook.py --skip-drift --skip-delivery --jobs 3
      - name: Verify editorial content and generated files
        if: steps.edition-scope.outputs.run_full == 'false'
        run: |
          python3 v0.5/scripts/check-md-conventions.py
          python3 v0.5/scripts/check-links.py
          python3 v0.5/scripts/check-public-content.py
          python3 v0.5/scripts/generate-status.py --check
          python3 v0.5/scripts/generate-manifest.py --check

  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Classify delivery test scope
        id: delivery-scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            {
              echo "run_delivery=true"
              echo "reason=manual workflow dispatch"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi

          python3 v0.5/scripts/delivery_ci_scope.py \
            --base "$base_sha" --head "$GITHUB_SHA" \
            >> "$GITHUB_OUTPUT"
      - name: Verify delivery contracts and fault tests
        if: steps.delivery-scope.outputs.run_delivery == 'true'
        run: sudo "$(command -v python3)" v0.5/delivery/scripts/verify.py --set K4.1 --jobs 3
      - name: Record delivery suite skip
        if: steps.delivery-scope.outputs.run_delivery != 'true'
        run: echo "Delivery suite skipped — ${{ steps.delivery-scope.outputs.reason }}."

  checkpoint-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.checkpoint_baseline
    needs: [edition, delivery]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pin clean reference checkouts
        run: |
          mkdir -p .context/measurements
          git worktree add --detach .context/baseline a3daedf03b24c5b3feb41d5953272d281de7b283
          git worktree add --detach .context/guidance-comparator 9d8dc1a5ec583aa3cd727a52d06dcd5438bf2a8e
      - name: Measure privileged serial baseline and complete standalone files
        run: |
          sudo --preserve-env=ImageOS,ImageVersion "$(command -v python3)" bench/profile_delivery_tests.py \
            --root .context/baseline --verify-suite --repeat 1 --output .context/measurements/baseline-delivery.json
      - name: Measure all guidance files at both fixed references
        run: |
          python3 bench/profile_delivery_tests.py --root .context/baseline --group guidance \
            --repeat 1 --output .context/measurements/baseline-guidance.json
          python3 bench/profile_delivery_tests.py --root .context/guidance-comparator --group guidance \
            --repeat 1 --output .context/measurements/comparator-guidance.json
      - name: Attribute baseline Git operations separately from acceptance timing
        run: |
          sudo --preserve-env=ImageOS,ImageVersion "$(command -v python3)" bench/profile_delivery_tests.py \
            --root .context/baseline --pattern test_interim_recovery.py --pattern test_interim_coordinator.py \
            --git-diagnostics --repeat 1 --output .context/measurements/baseline-diagnostic.json
      - name: Retain sanitised measurement reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-baseline
          path: .context/measurements/*.json
          retention-days: 30
