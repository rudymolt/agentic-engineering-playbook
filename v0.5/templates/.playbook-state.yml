# .playbook-state.yml
#
# Tracks cadence counters and timestamps for the AI engineering playbook.
# Updated by stage files (see {playbook-path}/v0.5/10-process/*) and by /whats-next.
# Do not hand-edit unless reconciling — let the stages and the skill maintain it.

schema_version: 3
last_updated: null   # ISO 8601 timestamp, set by every state write (stage updates and /whats-next)

# ── Pre-computed status block (schema 3) ──
# Generated by {playbook-path}/v0.5/scripts/compute-status.py; the script is
# the preferred writer for this block.
# Sessions read THIS block instead of reconciling the counters below
# against playbook-cadences.yml. Whoever changes state recomputes it:
# every stage's "State update" step and every /whats-next run must
# rewrite this block and set computed_at.
#
# Staleness rule: if computed_at is null or predates last_updated,
# the block is stale — fall back to full reconciliation (/whats-next
# Step 2), then rewrite the block.
status:
  computed_at: null        # ISO 8601; set whenever the block is rewritten
  headline: null           # one line, e.g. "nothing overdue; 1 feature in flight (sliced)"
  overdue: []              # cadences currently firing, worst first
    # - cadence_id: architecture-review
    #   severity: insist   # nudge | insist
    #   detail: "7 slices since last review (insist at 5)"
  features_by_stage: {}    # aggregate of active_features below
    # aligning: 0
    # spec-written: 0
    # sliced: 1
    # in-flight: 0
    # ready-to-ship: 0
  pending_plan_routes: 0   # resumable pending_model_routes; linked Wayfinder routes do not count
  pending_closeouts: 0     # shipped features still needing doc-close or retro

# The playbook version this project was bootstrapped from (or last upgraded to).
# Bootstrap and upgrade share the version implemented by their checkout. Compare it
# against {playbook-path}/v0.5/CHANGELOG.md at prereqs time to detect drift.
playbook_version: null   # e.g. "V0.5.0"
last_upgraded: null      # ISO 8601 date of bootstrap or the last upgrade
prereqs_required: true   # upgrades/bootstrap set true; a successful stage 00 cold path sets false

# Explicit decisions that suppress repeated prompts. Recorded, not assumed.
decisions:
  no_ui: null   # true = project has no UI; frontend artefact checks are skipped
  graduated_from_lite: null   # YYYY-MM-DD if this project graduated from lite mode (70-lite-mode.md)
  capability_profile: null   # core | accelerated | extended; set by stage 00 cold path
  technical_decisions: null  # ask | auto_recommend; null/ask preserves the default human decision gate
  verification_harness_path: null   # canonical selected project-relative harness directory
  verification_map_maintenance: false   # explicit opt-in; helper installation alone never enables it
  verification_harness_binding: null   # selected path bound by the explicit stage-owned selection transition

# Verified route for each required stage 00 lane. Values name the actual route,
# e.g. "tool: /tdd", "structural: Codex workspace sandbox", or "manual: stage 09".
capability_routes:
  repository: null
  human_decisions: null
  spec_and_slices: null
  implementation_and_diagnosis: null
  independent_verification: null
  real_environment_qa: null
  security: null
  state_lifecycle: null
  model_routing: null
  verified_at: null   # ISO 8601 timestamp of the last cold-path route audit

# Stage-aware model policy. Defaults remain OpenAI daily drivers; `models`
# discovers verified alternatives at a lane boundary instead of persisting a stale catalog.
model_routing:
  policy: gated
  defaults:
    planning: { model_id: gpt-5.6-sol, runner: codex, reasoning: high }
    implementation: { model_id: gpt-6-sol, runner: codex, reasoning: medium }
    verification: { model_id: gpt-6-sol, runner: codex, reasoning: high }
    # Plan may override before immutable unattended run approval. A legacy run
    # without an explicit escalation_policy in that approval gains no authority.
    escalated_repair: { model_id: gpt-6-astra, runner: codex, reasoning: high, trigger_unsuccessful_repairs: 3, cycles_per_slice: 2, scope: approved_slice, authority: diagnose_and_implement }
  allowed_runners: [codex, claude-code, cursor, opencode]

# Plan choices made before stage 01 proves that one normal feature exists.
# Resumable statuses: selected, running, waiting_manual, blocked.
# linked_wayfinder remains as policy for the map but is not a resumable planner.
pending_model_routes: []
  # - route_id: route-20260710-001
  #   request_title: Athlete export
  #   provisional_slug: athlete-export
  #   prompt_policy: ask_each_lane   # ask_each_lane | defaults_for_feature
  #   status: selected
  #   opened: 2026-07-10T12:00:00Z
  #   updated: 2026-07-10T12:00:02Z
  #   handoff_path: null
  #   planning:
  #     model_id: gpt-5.6-sol
  #     label: GPT-5.6 Sol
  #     provider: openai
  #     runner: codex
  #     reasoning: high
  #     selection_source: playbook_default
  #     launch_mode: external_sidecar
  #     permission_strength: enforced_read_only
  #     handoff_delivery: automatic
  #     selected_at: 2026-07-10T12:00:00Z
  #     identity:
  #       status: pending
  #       requested_model_id: gpt-5.6-sol
  #       reported_model_id: null
  #       evidence_kind: null   # e.g. provider_metadata | session_metadata | host_metadata
  #       verified_at: null

# Optional agent-owned delivery discovery pointers. Canonical mission truth is
# the digest-bound Mission Control record, never this summary list.
delivery_missions: []
  # - mission_id: mission-1
  #   locator: refs/heads/delivery-control/mission-1
  #   authority_class: tier-a-open-pr  # tier-a-open-pr | process-attested-fresh-merge
  #   status: running

# Counters used by count-type cadences.
counters:
  slices_shipped_total: 0
  slices_open: 0
  slices_since_last_architecture_review: 0
  features_shipped_total: 0
  features_in_alignment: 0
  bugs_diagnosed_total: 0

# Timestamps for time-type cadences. Diff against today's date.
# A null timestamp means the cadence can never fire, so bootstrap stamps retro,
# learnings_refresh, and (for UI projects) kitchen_sink_drift_audit with the
# bootstrap date as a baseline — the clock starts at bootstrap, not first use.
last_run:
  prereqs: null
  align: null
  architecture_review: null
  triage: null
  review: null
  cso: null
  qa: null
  ship: null
  feature_ship: null   # feature-level production ship; slice ships update ship only
  verification_map_enabled: null   # actual initial opt-in time for the selected harness
  verification_map_maintenance: null   # last accepted complete clean/changed audit only
  doc_close: null
  retro: null
  diagnose: null
  learnings_refresh: null
  kitchen_sink_drift_audit: null

# Feature-level work that remains after production ship. Stage 10 creates or
# updates the entry; stage 12 removes it only after both doc-close and retro.
pending_closeouts: []
  # - feature_slug: athlete-results-export
  #   title: Athlete results export
  #   shipped_at: 2026-05-24T15:30:00Z
  #   production_verified: false
  #   doc_close: pending      # pending | complete
  #   retro: pending          # pending | complete

# Pre-spec Wayfinder maps currently in discovery. The tracker is canonical;
# this lightweight mirror keeps maps visible to /whats-next's one-file fast path.
# Do not count these as active features. Clear the entry at graduation/abandonment.
active_wayfinding_maps: []
  # Example:
  # - title: Shape the account recovery experience
  #   locator: https://tracker.example/issue/ABC-123
  #   destination: An approved, implementation-ready recovery specification
  #   opened: 2026-07-10
  #   model_route_id: route-20260710-001

# Features currently in flight. Mirrors the folders in planning/.
# Allowed statuses: aligning, spec-written, sliced, in-flight, ready-to-ship
active_features: []
  # Example:
  # - slug: athlete-results-export
  #   status: sliced
  #   opened: 2026-05-24
  #   slices: 5
  #   slices_open: 2
  #   routing:
  #     prompt_policy: ask_each_lane
  #     promoted_from_route_id: route-20260710-001
  #     lanes: {}   # planning, implementation, verification selections
  #     # Each lane record may include pace: standard | fast. A fast Build run
  #     # carries into returned fixes and fresh Verify, then clears at handback.

# Dismissal log — /whats-next records every defer/skip here.
# Reviewed at the retro to tune playbook-cadences.yml.
dismissals: []
  # Example:
  # - cadence_id: architecture-review
  #   action: deferred      # deferred | skipped
  #   at: 2026-05-24T15:30:00Z
  #   user_note: null
